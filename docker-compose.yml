name: pg-replication-lab

services:
  # ==========================================================
  # КОНФІГУРАЦІЯ A: Single-Leader (1 лідер + 2 фоловери)
  # ==========================================================
  pg-leader-a:
    image: postgres:16.4-alpine
    container_name: pg-leader-a
    environment:
      POSTGRES_DB: notes_a
      POSTGRES_USER: repl_admin
      POSTGRES_PASSWORD: repl_password_a
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "wal_keep_size=2GB"
      - "-c"
      - "log_min_messages=info"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    ports:
      - "5432:5432"
    volumes:
      - pg_leader_a_data:/var/lib/postgresql/data
      - ./config/conf-a/leader/init-leader.sh:/docker-entrypoint-initdb.d/init-leader.sh:ro
      - ./config/conf-a/leader/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    cap_add:
      - NET_ADMIN
    networks:
      net_conf_a:
        ipv4_address: 172.28.1.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl_admin -d notes_a"]
      interval: 3s
      timeout: 3s
      retries: 20

  pg-follower-a1:
    image: postgres:16.4-alpine
    container_name: pg-follower-a1
    depends_on:
      pg-leader-a:
        condition: service_healthy
    environment:
      POSTGRES_USER: repl_admin
      POSTGRES_PASSWORD: repl_password_a
      LEADER_HOST: 172.28.1.10
      LEADER_PORT: "5432"
      SLOT_NAME: slot_follower_a1
      NODE_ROLE: follower_a1
    volumes:
      - pg_follower_a1_data:/var/lib/postgresql/data
      - ./config/conf-a/follower/entrypoint-follower.sh:/usr/local/bin/entrypoint-follower.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-follower.sh"]
    ports:
      - "5433:5432"
    cap_add:
      - NET_ADMIN
    networks:
      net_conf_a:
        ipv4_address: 172.28.1.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl_admin -d notes_a"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Другий фоловер підключається окремим кроком після засіву 100k+ нотаток
  # і запуску навантаження записів на лідер:
  # docker compose --profile follower-a2 up -d pg-follower-a2
  pg-follower-a2:
    image: postgres:16.4-alpine
    container_name: pg-follower-a2
    profiles:
      - follower-a2
    depends_on:
      pg-leader-a:
        condition: service_healthy
    environment:
      POSTGRES_USER: repl_admin
      POSTGRES_PASSWORD: repl_password_a
      LEADER_HOST: 172.28.1.10
      LEADER_PORT: "5432"
      SLOT_NAME: slot_follower_a2
      NODE_ROLE: follower_a2
    volumes:
      - pg_follower_a2_data:/var/lib/postgresql/data
      - ./config/conf-a/follower/entrypoint-follower.sh:/usr/local/bin/entrypoint-follower.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-follower.sh"]
    ports:
      - "5434:5432"
    cap_add:
      - NET_ADMIN
    networks:
      net_conf_a:
        ipv4_address: 172.28.1.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl_admin -d notes_a"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ==========================================================
  # КОНФІГУРАЦІЯ B: Multi-Leader (2 лідери з логічною реплікацією)
  # ==========================================================
  pg-leader-b1:
    image: postgres:16.4-alpine
    container_name: pg-leader-b1
    profiles:
      - conf-b
    environment:
      POSTGRES_DB: notes_b
      POSTGRES_USER: repl_admin
      POSTGRES_PASSWORD: repl_password_b
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_logical_replication_workers=8"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "log_min_messages=info"
    ports:
      - "5541:5432"
    volumes:
      - pg_leader_b1_data:/var/lib/postgresql/data
      - ./config/conf-b/init-b1.sql:/docker-entrypoint-initdb.d/init-b1.sql:ro
    cap_add:
      - NET_ADMIN
    networks:
      net_conf_b:
        ipv4_address: 172.29.1.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl_admin -d notes_b"]
      interval: 3s
      timeout: 3s
      retries: 20

  pg-leader-b2:
    image: postgres:16.4-alpine
    container_name: pg-leader-b2
    profiles:
      - conf-b
    environment:
      POSTGRES_DB: notes_b
      POSTGRES_USER: repl_admin
      POSTGRES_PASSWORD: repl_password_b
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_logical_replication_workers=8"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "log_min_messages=info"
    ports:
      - "5542:5432"
    volumes:
      - pg_leader_b2_data:/var/lib/postgresql/data
      - ./config/conf-b/init-b2.sql:/docker-entrypoint-initdb.d/init-b2.sql:ro
    cap_add:
      - NET_ADMIN
    networks:
      net_conf_b:
        ipv4_address: 172.29.1.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl_admin -d notes_b"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  net_conf_a:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  net_conf_b:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.1.0/24

volumes:
  pg_leader_a_data:
  pg_follower_a1_data:
  pg_follower_a2_data:
  pg_leader_b1_data:
  pg_leader_b2_data: